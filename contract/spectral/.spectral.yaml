# Packio contract ruleset — `pnpm contract:lint` (docs/contract/api-conventions.md §5).
# Runs on the generated contract/openapi.json; any warning fails CI (--fail-severity warn).
extends: [[spectral:oas, recommended]]
functionsDir: ./functions
functions:
  - responseSet
  - hasExample
  - noInlineEnum
  - objectShape
  - noDuplicateSchemas
  - noRealPersonalData
  - surfaceSecurity
  - statusByKind

rules:
  # --- built-in rules tightened ---------------------------------------------------------------
  tag-description: error
  operation-tag-defined: error
  operation-description: error
  oas3-unused-component: error
  oas3-valid-media-example: error
  oas3-valid-schema-example: error

  # --- operations ----------------------------------------------------------------------------
  packio-operation-id:
    description: operationId is `<surface>.<resource>.<action>` (e.g. admin.orders.approveSlip).
    severity: error
    given: $.paths[*][get,put,post,delete,patch]
    then:
      field: operationId
      function: pattern
      functionOptions:
        match: '^(auth|store|admin|partner|b2b|webhooks|ops)\.[a-z][A-Za-z0-9]*\.[a-z][A-Za-z0-9]*$'

  packio-operation-summary:
    description: Every operation has a one-line summary.
    severity: error
    given: $.paths[*][get,put,post,delete,patch]
    then:
      field: summary
      function: truthy

  packio-operation-implements:
    description: The description cites the decision (D-###) or ADR (ADR-####) the operation implements.
    severity: error
    given: $.paths[*][get,put,post,delete,patch]
    then:
      field: description
      function: pattern
      functionOptions:
        match: '(D-\d{3}|ADR-\d{4})'

  packio-operation-surface-tag:
    description: Exactly one tag, prefixed by the surface (store., admin., partner., auth., webhooks., ops.).
    severity: error
    given: $.paths[*][get,put,post,delete,patch]
    then:
      field: tags
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            pattern: '^(auth|store|admin|partner|b2b|webhooks|ops)\.[a-z][A-Za-z0-9]*$'

  packio-operation-security-declared:
    description: Every operation declares `security` (an empty list means public, on purpose).
    severity: error
    given: $.paths[*][get,put,post,delete,patch]
    then:
      field: security
      function: defined

  packio-surface-security:
    description: /v1/store, /v1/admin and /v1/partner operations use their audience's bearer scheme.
    message: '{{error}}'
    resolved: false
    severity: error
    given: $.paths
    then:
      function: surfaceSecurity

  packio-response-set:
    description: 2xx + 500, a 4xx set (401/403 when secured, 400/422 with a body), all errors as problem+json.
    message: '{{error}}'
    resolved: false
    severity: error
    given: $.paths[*][get,put,post,delete,patch]
    then:
      function: responseSet

  packio-status-by-kind:
    description: If-Match ⇒ 412, Idempotency-Key ⇒ 409, 202 ⇒ the polling operation is named (@ApiAsync).
    message: '{{error}}'
    resolved: false
    severity: error
    given: $.paths[*][get,put,post,delete,patch]
    then:
      function: statusByKind

  # --- examples ------------------------------------------------------------------------------
  packio-response-example:
    description: Every response body has an example.
    message: '{{error}}'
    resolved: false
    severity: error
    given: $.paths[*][*].responses[*].content[*]
    then:
      function: hasExample

  packio-request-example:
    description: Every request body has an example.
    message: '{{error}}'
    resolved: false
    severity: error
    given: $.paths[*][*].requestBody.content[*]
    then:
      function: hasExample

  packio-no-real-personal-data:
    description: Examples must use obviously fake data (see contract/spectral/README.md).
    message: '{{error}}'
    resolved: false
    severity: error
    given: $
    then:
      function: noRealPersonalData

  # --- schemas -------------------------------------------------------------------------------
  packio-no-inline-enum:
    description: Enums are named components (enumName), never inline.
    message: '{{error}}'
    resolved: false
    severity: error
    given: $
    then:
      function: noInlineEnum

  packio-object-shape:
    description: '`type: object` must declare properties, additionalProperties or composition.'
    message: '{{error}}'
    resolved: false
    severity: error
    given: $
    then:
      function: objectShape

  packio-no-duplicate-schemas:
    description: Two component schemas must not have the same shape.
    message: '{{error}}'
    resolved: false
    severity: error
    given: $.components.schemas
    then:
      function: noDuplicateSchemas
