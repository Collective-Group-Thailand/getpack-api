name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint · format · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The type-aware lint of the whole repo outgrew Node's default heap (U3, 2026-10-03).
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm format:check
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:cov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  integration:
    name: integration (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:int

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:e2e

  contract:
    name: contract lint · drift · oasdiff breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Regenerate contract
        run: pnpm contract:build
      - name: Contract lint (Spectral, api-conventions §5)
        run: pnpm contract:lint
      - name: Contract drift (commit the regenerated contract/openapi.json)
        run: git diff --exit-code -- contract/openapi.json
      - name: Breaking changes vs main
        if: github.event_name == 'pull_request'
        env:
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'contract:breaking') }}
        run: |
          if ! git show "origin/${{ github.base_ref }}:contract/openapi.json" > /tmp/base-openapi.json 2>/dev/null; then
            echo "No contract on ${{ github.base_ref }} yet — skipping breaking-change check."
            exit 0
          fi
          set +e
          docker run --rm -v /tmp:/base:ro -v "$PWD/contract":/head:ro tufin/oasdiff:v1.11.7 \
            breaking /base/base-openapi.json /head/openapi.json --fail-on ERR --format githubactions
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$ALLOW_BREAKING" != "true" ]; then
            echo "::error::Breaking contract change. Use a new version prefix or coordinate with a packio-web PR and add the 'contract:breaking' label (api-conventions §1)."
            exit 1
          fi

  prisma-drift:
    name: prisma drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: packio
          POSTGRES_PASSWORD: packio
          POSTGRES_DB: packio_shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U packio" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SHADOW_DATABASE_URL: postgresql://packio:packio@localhost:5432/packio_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Schema matches migrations
        run: |
          if [ ! -f prisma/migrations/migration_lock.toml ]; then
            echo "No migrations yet (they start in B1.2) — skipping drift check."
            exit 0
          fi
          pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema --exit-code

  build:
    name: build · image · scan
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: packio-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: packio-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
