<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>getpack LINE และลิงก์</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap">
<style>
:root{--bg:#F6F5F1;--surface:#FFFFFF;--surface-2:#EFEEE9;--stage:#EDECE6;--fg:#16201B;--fg-2:#4A554F;--fg-3:#7B847F;--line:#E3E1DA;--line-2:#CFCDC5;--brand:#17573F;--brand-h:#0E4430;--brand-t:#E2EDE7;--ok:#1F7A57;--warn:#9A6210;--err:#B8352B;--info:#2F5FD0;--warn-t:#FBF0DC;--err-t:#FBE4E1;--line-green:#06C755;--shadow:0 8px 24px rgba(22,32,27,.08);--f:'Anuphan',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1412;--surface:#161C19;--surface-2:#1D2521;--stage:#1A211E;--fg:#ECEFEC;--fg-2:#B5BEB8;--fg-3:#8A948E;--line:#29322D;--line-2:#3A443F;--brand:#56BC91;--brand-h:#6FD0A6;--brand-t:#18352A;--ok:#5CC596;--warn:#E0A84A;--err:#F0796D;--info:#7FA2F0;--warn-t:#3A2E17;--err-t:#3D1E1B;--shadow:0 8px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1412;--surface:#161C19;--surface-2:#1D2521;--stage:#1A211E;--fg:#ECEFEC;--fg-2:#B5BEB8;--fg-3:#8A948E;--line:#29322D;--line-2:#3A443F;--brand:#56BC91;--brand-h:#6FD0A6;--brand-t:#18352A;--ok:#5CC596;--warn:#E0A84A;--err:#F0796D;--info:#7FA2F0;--warn-t:#3A2E17;--err-t:#3D1E1B;--shadow:0 8px 24px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.65 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:500;color:var(--fg-3);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:20px;vertical-align:middle;white-space:nowrap}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.dot.ok{color:var(--ok)}.dot.warn{color:var(--warn)}.dot.err{color:var(--err)}.dot.info{color:var(--info)}.dot.mute{color:var(--fg-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0F1412}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0F1412}}
.btn.pri:hover{background:var(--brand-h)}
.btn.pri[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.blk{width:100%;height:44px}
.btn.txt{border:0;background:none;color:var(--brand);padding:0 4px;height:auto}
.btn.txt:hover{text-decoration:underline;background:none}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:500;color:var(--fg-2)}
.fld input,.fld textarea,.fld select{height:44px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 12px;width:100%}
.fld textarea{height:auto;padding:10px 12px}
.fld small{font-size:12.5px;color:var(--fg-3)}
.muted{color:var(--fg-3)}
.sec{font-size:13px;font-weight:500;color:var(--fg-3);margin:0 0 8px}

/* ---------- prototype chrome ---------- */
.rib{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-left));background:#16201B;color:#ECEFEC;font-size:13px}
.rib b{font-weight:600;margin-right:auto}
.rib .tg{display:flex;border:1px solid #3A443F;border-radius:8px;overflow:hidden}
.rib .tg button{border:0;background:none;color:#B5BEB8;padding:4px 10px;cursor:pointer}
.rib .tg button[aria-pressed="true"]{background:#ECEFEC;color:#16201B}
.rib .chg{border:1px solid #3A443F;background:none;color:#ECEFEC;border-radius:8px;padding:4px 10px;cursor:pointer}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 44px)}
.idx{border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:44px;align-self:start;height:calc(100vh - 44px);overflow:auto;background:var(--surface)}
.idx h2{font-size:12px;font-weight:500;color:var(--fg-3);margin:16px 8px 6px}
.idx h2:first-child{margin-top:0}
.idx a{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;color:var(--fg-2);text-decoration:none;font-size:14px}
.idx a small{color:var(--fg-3);font-size:12px}
.idx a[aria-current="page"]{background:var(--surface-2);color:var(--fg);font-weight:500}
.idxsel{display:none;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.idxsel select{width:100%;height:40px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 10px}
.stage{min-width:0;padding:32px 40px 64px}
.stage-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;max-width:1120px}
.stage-h h1{font-size:24px}
.stage-h p{margin:2px 0 0;color:var(--fg-3);font-size:13px}
@media (max-width:900px){.shell{grid-template-columns:1fr}.idx{display:none}.idxsel{display:block}.stage{padding:20px 16px 48px}}

/* ---------- phone (LIFF) ---------- */
.phone{width:390px;max-width:100%;margin:0 auto;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow);position:relative}
.ln{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;background:#fff;border-bottom:1px solid #E5E5E5;color:#111;font-size:14px}
.ln .x{font-size:18px;color:#555;width:20px}
.ln b{flex:1;text-align:center;font-weight:600}
.ln .ln-m{color:#555;letter-spacing:2px}
:root[data-theme="dark"] .ln{background:#111;color:#eee;border-color:#222}
.lbar{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.lbar .wm{font-weight:600;font-size:16px;letter-spacing:-.01em}
.lbar .wm span{font-weight:400;color:var(--fg-3);font-size:13px;margin-left:4px}
.lbar .back{display:inline-flex;align-items:center;gap:4px;color:var(--fg);text-decoration:none;font-size:14px;font-weight:500;background:none;border:0;padding:0;cursor:pointer}
.lbar .back .ico{transform:rotate(180deg)}
.lmain{padding:20px 16px 96px;min-height:640px;display:flex;flex-direction:column;gap:22px}
.ltabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:6px}
.ltabs button{flex:1;height:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--fg-3);cursor:pointer}
.ltabs button[aria-current="page"]{color:var(--fg);font-weight:600}
.ltabs .ico{width:20px;height:20px}
.ltabs .bdg{position:absolute;margin:-26px 0 0 22px;min-width:16px;height:16px;border-radius:8px;background:var(--err);color:#fff;font-size:10.5px;line-height:16px;text-align:center;padding:0 4px}
.lh1{font-size:24px;letter-spacing:-.01em}
.lsub{margin:2px 0 0;color:var(--fg-3);font-size:13.5px}
.list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.list>.r{display:flex;gap:12px;align-items:center;padding:14px;border-top:1px solid var(--line)}
.list>.r:first-child{border-top:0}
.list>.r .t{flex:1;min-width:0}
.list>.r .t b{display:block;font-weight:500;font-size:14.5px}
.list>.r .t small{display:block;color:var(--fg-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list>.r .t .dot{margin-top:3px}
.list>a.r{color:inherit;text-decoration:none}
.amt{font-weight:600;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
.kv dt{color:var(--fg-3)}
.kv dd{margin:0;text-align:right}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.steps span{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--fg-3)}
.steps span::before{content:"";height:3px;border-radius:2px;background:var(--line)}
.steps span.d::before{background:var(--brand)}
.steps span.c{color:var(--fg);font-weight:600}
.steps span.c::before{background:linear-gradient(90deg,var(--brand) 50%,var(--line) 50%)}
.next{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;display:flex;flex-direction:column;gap:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cmp div{padding:10px 12px;font-size:13px;color:var(--fg-3)}
.cmp div+div{border-left:1px solid var(--line)}
.cmp b{display:block;color:var(--fg);font-size:16px}
.seg2{display:flex;gap:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.seg2 button{border:0;background:none;padding:8px 0;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--fg-3);font-size:14px;cursor:pointer;white-space:nowrap}
.seg2 button[aria-selected="true"]{color:var(--fg);border-color:var(--fg);font-weight:500}
.seg2 em{font-style:normal;font-size:12px;color:var(--fg-3);margin-left:4px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.qr{width:200px;height:200px;margin:0 auto;border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;place-items:center}
.qr svg{width:168px;height:168px}
.drop{border:1px dashed var(--line-2);border-radius:10px;padding:16px;text-align:center;font-size:13.5px;color:var(--fg-2)}
.proof{border:1px solid var(--line);border-radius:12px;background:var(--stage);aspect-ratio:4/3;position:relative;overflow:hidden}
.proof svg{width:100%;height:100%}
.pin{position:absolute;width:24px;height:24px;border-radius:50% 50% 50% 0;background:var(--fg);color:var(--bg);font-size:11.5px;font-weight:600;display:grid;place-items:center;transform:rotate(-45deg)}
.pin span{transform:rotate(45deg)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;z-index:5}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:80;max-width:calc(100vw - 32px)}
.note-inline{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--fg-2)}
.note-inline .dot{margin-top:6px}

/* ---------- sign-in ---------- */
.auth{display:grid;grid-template-columns:5fr 7fr;min-height:640px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);max-width:1120px}
.auth-l{background:var(--surface-2);padding:40px;display:flex;flex-direction:column;gap:20px}
.auth-l .wm{font-weight:600;font-size:20px}
.auth-l h2{font-size:40px;letter-spacing:-.02em;margin-top:40px}
.auth-l ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;color:var(--fg-2)}
.auth-l li{padding-left:16px;position:relative}
.auth-l li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:1px;background:var(--fg-3)}
.auth-l .foot{margin-top:auto;font-size:13px;color:var(--fg-3);border-top:1px solid var(--line);padding-top:16px}
.auth-r{display:flex;flex-direction:column;justify-content:center;padding:40px}
.auth-f{width:100%;max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.auth-f h3{font-size:22px}
.ph66{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;height:44px;background:var(--surface)}
.ph66 span{display:grid;place-items:center;padding:0 12px;background:var(--surface-2);border-right:1px solid var(--line);color:var(--fg-2)}
.ph66 input{border:0;flex:1;padding:0 12px;background:none;min-width:0}
.or{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--fg-3)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.lineb .lg{width:18px;height:18px;border-radius:5px;background:var(--line-green);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{height:52px;text-align:center;font-size:20px;font-weight:500;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);width:100%}
.otp.bad input{border-color:var(--err)}
.err{color:var(--err);font-size:13.5px;display:flex;gap:6px;align-items:center}
.auth-legal{font-size:12.5px;color:var(--fg-3);text-align:center}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-l{padding:24px}.auth-l h2{font-size:28px;margin-top:8px}.auth-l ul,.auth-l .foot{display:none}.auth-r{padding:24px 16px 32px}}

/* ---------- white-label quote ---------- */
.ql{background:#F2F2F0;color:#1A1A1A;border-radius:16px;padding:32px 16px;max-width:1120px;--acc:#1F4E79}
:root[data-theme="dark"] .ql{background:#1B1B1A;color:#EDEDEB}
.paper{max-width:860px;margin:0 auto;background:#fff;border:1px solid #E2E2DE;border-radius:4px;color:#1A1A1A}
.paper .pp{padding:32px}
.paper .top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.paper .logo{width:52px;height:52px;border:1px solid #E2E2DE;border-radius:6px;display:grid;place-items:center;color:var(--acc);font-weight:700}
.paper h2{font-size:28px;text-align:right}
.paper .meta{font-size:13px;color:#555}
.paper hr{border:0;border-top:1px solid #E2E2DE;margin:0}
.paper .two{display:grid;grid-template-columns:1fr 1fr;gap:24px;background:#FAFAF8}
.paper table{width:100%;border-collapse:collapse;font-size:14px}
.paper th{font-weight:500;color:#555;text-align:left;padding:10px 8px;border-bottom:1.5px solid #1A1A1A;font-size:12.5px}
.paper td{padding:12px 8px;border-bottom:1px solid #E2E2DE;vertical-align:top}
.paper .n{text-align:right;white-space:nowrap}
.paper .tot{margin-left:auto;max-width:340px;display:grid;grid-template-columns:1fr auto;gap:6px 24px;font-size:14px}
.paper .tot .g{font-size:20px;font-weight:600;border-top:1.5px solid #1A1A1A;padding-top:8px}
.paper .resp{background:#FAFAF8;border-top:1px solid #E2E2DE;padding:24px 32px;display:flex;flex-direction:column;gap:14px}
.paper .resp .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.paper .fld input{background:#fff;border-color:#D5D5D0;color:#1A1A1A}
.paper .fld label{color:#555}
.qlfoot{max-width:860px;margin:12px auto 0;font-size:12.5px;color:#777;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tblwrap{overflow-x:auto}
@media (max-width:700px){.paper .pp{padding:20px}.paper .two{grid-template-columns:1fr}.paper h2{text-align:left}.paper .resp{padding:20px}}

/* ---------- shared design / generic page ---------- */
.web{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);max-width:1120px}
.webh{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.webh .wm{font-weight:600;font-size:18px}
.webb{padding:32px 24px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px}
.webb.one{grid-template-columns:minmax(0,640px);justify-content:center}
.dieline{background:var(--stage);border:1px solid var(--line);border-radius:12px;aspect-ratio:5/4;position:relative}
.dieline svg{width:100%;height:100%}
.cmt{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.cmt .av{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
@media (max-width:860px){.webb{grid-template-columns:1fr;padding:20px 16px}.webh{padding:0 16px}}

/* ---------- notes drawer ---------- */
.drw{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:70;display:flex;flex-direction:column}
.drw[hidden]{display:none}
.drw header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.drw .bd{overflow:auto;padding:16px 20px 32px;display:flex;flex-direction:column;gap:18px;font-size:14px}
.drw h3{font-size:13px;color:var(--fg-3);font-weight:500;margin-bottom:6px}
.drw ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.drw code{font-family:var(--f);background:var(--surface-2);padding:0 4px;border-radius:4px;font-size:13px}
.xbtn{border:0;background:none;cursor:pointer;color:var(--fg-2);padding:4px}
.shell>div{min-width:0}
.phone{width:100%;max-width:390px}
@media (max-width:480px){.stage .phone{border-radius:0;border-left:0;border-right:0;margin:0 -16px;width:calc(100% + 32px);max-width:none;box-shadow:none}.ql{padding:16px 0;border-radius:0;margin:0 -16px}.paper{border-left:0;border-right:0;border-radius:0}}
.webb>*{min-width:0}
.list>a.r .ico{transform:rotate(-90deg);color:var(--fg-3)}

<script>
window.__R2NOTES={
'l-home':{f:['สถานะ "รอชำระเงิน" คู่กับปุ่ม "ส่งไฟล์งาน" ในแถวเดียวกัน ลูกค้าไม่รู้ว่าต้องทำอะไรก่อน (UATOR-2610-00016)','ชื่อสินค้าเป็นชื่อประเภท "กล่องกระดาษลูกฟูก" แต่หน้ารายการใช้ "กล่องไปรษณีย์ ฝาชน 3 ชั้น (ลอน B)"','การ์ดคะแนนแสดง 20 ไม่บอกมูลค่าเป็นเงินและไม่บอกระยะถึงระดับถัดไป','ไม่บอกว่าเรื่องไหนเร่ง (เลยกำหนด/ใกล้กำหนด) และไม่บอกเวลาทำการของแชท'],
 d:['คิว "ต้องทำ" เรียงตามวันครบกำหนด แต่ละแถวมีงานเดียวและปุ่มเดียว (F32 เวอร์ชัน LINE)','สถานะเป็นจุด + ข้อความ บอกวันชัดเจน เลยกำหนดบอกเสมอว่า "ยังไม่ถูกยกเลิก" (กฎ re-quote)','ชื่อสินค้าใช้ชื่อเดียวกับหน้ารายการทุกที่','คะแนนบอกมูลค่า ฿ และระยะถึงระดับซิลเวอร์ตาม P-04','จำนวนเรื่องรอคุณขึ้นที่แท็บคำสั่งซื้อ'],
 s:['GET /v1/store/me/todo → [{kind: pay|artwork|proof|wht|approval|claim, orderId, dueAt, amount?, cta}] เรียงตาม dueAt (ใช้ร่วมกับ F32 บนเว็บ)','ชื่อสินค้า: ใช้ order.displayName ตัวเดียวกับ /liff/orders (ไม่ใช้ productTypeName)','points: availablePoints, valueThb, tier, spend12m, nextTier{name,thresholdThb,multiplier}','LiffNav รับ badge จาก todo.length']},
'l-orders':{f:['ไม่มีตัวกรอง แสดงเฉพาะที่ระบบเลือก ไม่มียอดเงินและวันที่','แถวที่เลยกำหนดไม่ต่างจากแถวปกติ'],d:['แท็บเส้นใต้ ต้องทำ / กำลังผลิต / เสร็จแล้ว พร้อมจำนวน','แถวมีเลขคำสั่งซื้อ สินค้า จำนวน สถานะเป็นจุด และยอดรวมชิดขวา','ว่างแล้วบอกตามจริงว่าเมื่อไรรายการจะมาอยู่ตรงนี้'],s:['GET /v1/store/orders?group=todo|in_production|done&limit=20 (cursor)','จัดกลุ่มจาก customerStatus ที่คำนวณที่ API ที่เดียว (account Phase 0)']},
'l-order':{f:['เลยกำหนดชำระแล้วต้อง "เปิดในเว็บเพื่อตรวจราคาใหม่และชำระ" ทำใน LINE ไม่ได้','หัวข้อ "ความคืบหน้า" แสดงแต่ไม่มีขั้นตอน (ว่าง)','มีป้ายสถานะ 2 อัน (รอชำระเงิน + รอไฟล์จากคุณ) และปุ่มหลักคือส่งไฟล์ ขัดกับเรื่องที่เร่งกว่า'],
 d:['บล็อก "ขั้นถัดไป" อันเดียว: ตรวจราคาวันนี้เทียบราคาเดิม แล้วยืนยันและชำระใน LINE ได้เลย','ส่งไฟล์ก่อนได้เป็นทางเลือกรอง (ทีมตรวจไฟล์ระหว่างรอชำระ)','แถบ 6 ขั้นแสดงจริงเสมอ','ลิงก์คุยกับทีมพาเลขคำสั่งซื้อไปด้วย'],
 s:['POST /v1/store/orders/{id}/requote → {oldTotal,newTotal,changed,validUntil} แล้ว POST /v1/store/payments (Idempotency-Key) → paymentId → /liff/pay/{id}','ห้าม auto-cancel (กฎเดิม) · ข้อความ "ยังไม่ถูกยกเลิก" แสดงเมื่อ overdue','OrderStages ใช้ stages จาก API เสมอ ถ้าว่างแสดงขั้นตอนมาตรฐาน 6 ขั้นแบบยังไม่เริ่ม']},
'l-proof':{f:['ยังไม่มีแบบตัวอย่าง: ข้อความบอก "ทีมพรีเพรส" (ศัพท์ภายใน)','ลิงก์กลับชื่อ "กลับไปที่ไฟล์งานพิมพ์" ไม่ตรงกับหน้าที่มา'],
 d:['ดูแบบ ปักหมุดความเห็นบนแบบ ส่งให้ทีมแก้ และอนุมัติได้ใน LINE (F33)','เทียบฉบับ 1 กับ 2','อนุมัติต้องติ๊กยืนยันว่าตรวจครบ และบอกค่าคลาดเคลื่อนที่ยอมรับ (± 3 มม. / ΔE2000 ≤ 3)','ใช้คำว่า "ทีม" แทน "ทีมพรีเพรส"'],
 s:['GET /v1/store/orders/{id}/proofs (versions, pins) · POST …/proofs/{v}/pins {x,y,text} · POST …/proofs/{v}/approve {confirmedChecklist:true}','pin x,y เป็นสัดส่วน 0–1 ของภาพ · ทีมเห็นใน admin claims/proof queue','แจ้งเตือน LINE เมื่อมีฉบับใหม่ (ลิงก์ /l/{token})']},
'l-reorder':{f:['"ราคานี้ใช้ได้ถึง 28 ต.ค. 2569 15:25" (วันเดียว) ขัด P-24 ราคาสั่งซ้ำยืน 15 วัน','"ผลิตประมาณ 10 วันทำการ" ไม่บอกเหตุผล ขัด P-26','บน LINE ตาราง 2 คอลัมน์ทำให้สเปกบีบจนอ่านยาก','มีสองทางเลือก (ไฟล์เดิม/ไฟล์ใหม่) ในกล่องสีพร้อมกัน'],
 d:['ราคายืน 15 วัน และปุ่มรอง "เก็บเป็นใบเสนอราคา"','ปุ่มจำนวนลัด (1,000 / 3,000 / 5,000) พร้อมบอกจุดที่ราคาต่อชิ้นลด (F14)','ไฟล์เดิมเป็นค่าเริ่มต้น บอกเป็นบรรทัดเดียว','คอลัมน์เดียวบนมือถือ'],
 s:['reorder quote = saved quote ยืน 15 วัน (P-24)','lead time จาก pricing service พร้อม reason เมื่อ > 5 วันทำการ (P-26)','POST /v1/store/orders/{id}/reorder {qty, reuseArtwork:true} → quoteId หรือ paymentId']},

function qrish(){let s='',seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;for(let y=0;y<29;y++)for(let x=0;x<29;x++){const f=(x<7&&y<7)||(x>21&&y<7)||(x<7&&y>21);if(f){const e=(x%22===0||x%22===6||y%22===0||y%22===6)||((x%22>=2&&x%22<=4)&&(y%22>=2&&y%22<=4));if(e)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`}else if(rnd()>.55)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`}return s}
