<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>getpack คลังแบรนด์</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Mitr:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap">
<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --surface-2:#EFEEE9; --stage:#EDECE6;
  --fg:#16201B; --fg-2:#4A554F; --fg-3:#7B847F; --line:#E3E1DA; --line-2:#CFCDC5;
  --brand:#17573F; --brand-hover:#0E4430; --brand-tint:#E2EDE7; --on-brand:#FFFFFF;
  --instant:#8F530E; --instant-tint:#F6EAD9;
  --shadow:0 1px 2px rgba(22,32,27,.06),0 8px 24px -12px rgba(22,32,27,.18);
  --f-display:"Anuphan","IBM Plex Sans Thai",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Anuphan",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --gutter:max(16px,env(safe-area-inset-left,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#161C19; --surface-2:#1D2521; --stage:#212925;
  --fg:#ECEFEC; --fg-2:#B5BEB8; --fg-3:#89938D; --line:#29322D; --line-2:#3A453F;
  --brand:#56BC91; --brand-hover:#71CCA4; --brand-tint:#17322A; --on-brand:#06120C;
  --instant:#E7AA60; --instant-tint:#33271A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#161C19; --surface-2:#1D2521; --stage:#212925;
  --fg:#ECEFEC; --fg-2:#B5BEB8; --fg-3:#89938D; --line:#29322D; --line-2:#3A453F;
  --brand:#56BC91; --brand-hover:#71CCA4; --brand-tint:#17322A; --on-brand:#06120C;
  --instant:#E7AA60; --instant-tint:#33271A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:1360px;margin:0 auto;padding-left:var(--gutter);padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* prototype ribbon */
.proto{background:var(--fg);color:var(--bg);font-size:13px}
.proto .wrap{display:flex;align-items:center;gap:12px;min-height:36px;padding-block:4px}
.proto b{font-weight:600;white-space:nowrap}
.proto button{margin-left:auto;background:none;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);border-radius:99px;padding:2px 12px;color:var(--bg);font-size:13px;white-space:nowrap}
.proto span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:28px;height:64px}
.logo{font:700 26px/1 var(--f-display);letter-spacing:-.03em;color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:2px;flex:none}
.logo i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--brand);transform:translateY(-9px) rotate(45deg)}
.nav{display:flex;gap:4px;min-width:0}
.nav a{padding:8px 12px;border-radius:8px;color:var(--fg-2);text-decoration:none;font-weight:500;font-size:14.5px;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current]{color:var(--fg);background:var(--surface-2)}
.hright{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.ibtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:0;background:none;color:var(--fg-2)}
.ibtn:hover{background:var(--surface-2);color:var(--fg)}
.ibtn .dot{position:absolute;top:6px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--brand);color:var(--on-brand);font:600 10.5px/17px var(--f-body);text-align:center}
.lang{height:40px;padding:0 10px;border:0;background:none;border-radius:10px;color:var(--fg-2);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.lang:hover{background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-tint);color:var(--brand);font:600 13px/34px var(--f-body);text-align:center;border:0;margin:0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--fg)}
.btn-ghost:hover{border-color:var(--fg-3)}
.menu-btn{display:none}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:13.5px;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.switch{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:translate .15s}
.switch:checked{background:var(--brand)}.switch:checked::after{translate:14px 0}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 24px 20px;flex-wrap:wrap}
/* rfq tray + toast + dialog */
.tray{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 18px;border-radius:16px;background:var(--fg);color:var(--bg);box-shadow:0 18px 40px -12px rgba(0,0,0,.45);max-width:calc(100% - 32px);transition:translate .25s,opacity .25s}
.tray[hidden]{display:flex!important;opacity:0;pointer-events:none;translate:-50% 24px}
.tray p{margin:0;font-size:14px;white-space:nowrap}
.tray p b{font-variant-numeric:tabular-nums}
.tray .btn{height:38px;background:var(--bg);color:var(--fg)}
.tray .x{border:0;background:none;color:var(--bg);opacity:.7;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:45;background:var(--surface);color:var(--fg);border:1px solid var(--line-2);box-shadow:var(--shadow);padding:10px 16px;border-radius:10px;font-size:13.5px}
dialog{border:0;padding:0;border-radius:20px;background:var(--surface);color:var(--fg);width:min(720px,calc(100% - 32px));max-height:calc(100% - 48px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,15,12,.5)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.dlg-h h2{font:600 20px var(--f-display);margin:0}
.dlg-b{padding:8px 24px 24px}
.dlg-b h3{font:600 15px var(--f-display);margin:20px 0 6px;color:var(--brand)}
.dlg-b ul{margin:0;padding-left:20px;color:var(--fg-2);font-size:14px;display:flex;flex-direction:column;gap:4px}
.dlg-b .note{margin-top:20px;padding:12px 14px;border-radius:10px;background:var(--instant-tint);font-size:13.5px}
.chat{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:41;transition:bottom .25s}
.tray:not([hidden])~.chat{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.chat>button{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 14px;border-radius:24px;border:0;background:#06C755;color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 12px 30px -10px rgba(6,120,60,.6)}
.chat>button .ico{width:22px;height:22px}
.chat-pop{position:absolute;right:0;bottom:60px;width:290px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px -18px rgba(0,0,0,.4);padding:18px}
.chat-pop h3{font:600 16px var(--f-display);margin:0 0 4px}
.chat-pop p{margin:0 0 12px;font-size:13.5px;color:var(--fg-2)}

@media (max-width:1180px){.nav a{padding:8px 9px}.hdr .wrap{gap:18px}}
@media (max-width:1040px){
  .nav{display:none}.menu-btn{display:grid}
  .head-grid,.calc{grid-template-columns:minmax(0,1fr)}
  .modes,.factors{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}.step:nth-child(2){border-right:0}.step:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .svc{grid-template-columns:minmax(0,1fr)}
  .faq{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .hdr .cta,.lang,.avatar{display:none}
  .hdr .wrap{height:58px}
  .secnav{top:calc(env(safe-area-inset-top,0px) + 58px)}
  .head{padding-block:20px 0}
  .modes{grid-template-columns:minmax(0,1fr);gap:8px}
  .mode{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:14px}
  .mode p{flex-basis:100%}.mode small{margin-top:0}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cbody{padding:12px}.card h3{font-size:14.5px}.pr b{font-size:18px}.cfoot{flex-direction:column}
  .calc-in,.calc-out{padding:20px}
  .factors,.steps{grid-template-columns:minmax(0,1fr)}.step{border-right:0;border-bottom:1px solid var(--line)}
  .tb-r{margin-left:0;width:100%}.tb-r .select{flex:1}.tb-r select{width:100%}
  .cta-band{grid-template-columns:minmax(0,1fr);padding:24px}
  .chat>button span{display:none}.chat>button{padding:0 13px}
  .tray p{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- /account + /account/orders + order detail ---------- */
/* Layout: account shell (compact grouped nav) · orders: to-do strip, status tabs, search/filters, order cards with stage tracker · detail: header, timeline with evidence, delivery, payment, documents, reorder */
:root{--ok:#1F7A57;--ok-tint:#E1F0E8;--warn:#9A6210;--warn-tint:#FBF0DC;--err:#B8352B;--err-tint:#FBE4E1;--info:#2F5FD0;--info-tint:#E3EAFB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#4CC08F;--ok-tint:#173328;--warn:#E3A84B;--warn-tint:#33281A;--err:#F07468;--err-tint:#3A1D1A;--info:#7EA2FF;--info-tint:#1B2440}}
:root[data-theme="dark"]{--ok:#4CC08F;--ok-tint:#173328;--warn:#E3A84B;--warn-tint:#33281A;--err:#F07468;--err-tint:#3A1D1A;--info:#7EA2FF;--info-tint:#1B2440}
[hidden]{display:none!important}
.samplechip{display:inline-block;font:500 11px var(--f-mono);padding:1px 7px;border-radius:6px;border:1px dashed var(--line-2);color:var(--fg-3);white-space:nowrap;vertical-align:middle}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);gap:28px;padding-block:28px 96px;align-items:start}
/* nav */
.anav{position:sticky;top:88px;display:flex;flex-direction:column;gap:2px}
.me{display:flex;gap:12px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.me .av{width:42px;height:42px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;font:600 15px var(--f-display);flex:none}
.me b{display:block;font-weight:600}.me small{color:var(--fg-3);font-size:12.5px}
.anav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--fg-2);text-decoration:none;font-size:14.5px;font-weight:500}
.anav a:hover{background:var(--surface-2);color:var(--fg)}
.anav a[aria-current]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.anav a .ico{width:18px;height:18px}
.anav a .cnt{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--brand);color:var(--on-brand);font:600 11.5px/22px var(--f-body);text-align:center;padding:0 6px}
.anav a .cnt.w{background:var(--warn-tint);color:var(--warn)}
.anav .sub{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:14px 10px 4px}
.anav .out{margin-top:10px;color:var(--fg-3)}
/* page head */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font:700 clamp(28px,3vw,36px)/1.1 var(--f-display);letter-spacing:-.02em;margin:0}
.ph p{margin:6px 0 0;color:var(--fg-2)}
/* todo strip */
.todo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
.td{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.td .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.td .ic .ico{width:20px;height:20px}
.td.pay .ic{background:var(--err-tint);color:var(--err)}.td.file .ic{background:var(--info-tint);color:var(--info)}.td.recv .ic{background:var(--ok-tint);color:var(--ok)}
.td b{display:block;font-weight:600;font-size:14.5px}.td small{display:block;color:var(--fg-3);font-size:12.5px;margin-top:2px}
.td .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.td .btn{height:36px;font-size:13.5px;padding:0 14px}
.late{display:inline-block;font:600 11.5px var(--f-body);padding:1px 8px;border-radius:99px;background:var(--err-tint);color:var(--err);margin-left:4px}
/* tools */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs3{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs3 button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:500;font-size:13.5px;color:var(--fg-2);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs3 button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.tabs3 .n{font:600 11.5px var(--f-mono);color:var(--fg-3)}
.srch{position:relative;flex:1;min-width:200px;max-width:360px;margin-left:auto}
.srch input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px 0 36px;font-size:14px;color:var(--fg)}
.srch .ico{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--fg-3)}
/* group + order cards */
.grp{border:1px dashed var(--line-2);border-radius:20px;padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 6px}
.grp-h b{font-weight:600}.grp-h small{color:var(--fg-3);font-size:13px}
.oc{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:18px;display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:start;cursor:pointer;transition:border-color .15s}
.oc:hover{border-color:var(--fg-3)}
.oc .th{width:72px;height:72px;border-radius:14px;background:var(--stage);display:grid;place-items:center}
.oc .th svg{width:62px;height:62px}
.oc h3{margin:0;font:600 16px var(--f-display)}
.oc .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--fg-3);margin-top:4px}
.oc .meta code{font:500 12.5px var(--f-mono);color:var(--fg-2)}
.oc .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
.oc .tot{font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.oc .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.oc .acts .btn{height:36px;font-size:13.5px;padding:0 14px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--f-body);padding:3px 10px;border-radius:99px}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.pay{background:var(--err-tint);color:var(--err)}.pill.ship{background:var(--info-tint);color:var(--info)}.pill.prod{background:var(--warn-tint);color:var(--warn)}.pill.done{background:var(--ok-tint);color:var(--ok)}
/* stage tracker */
.stg{grid-column:2/-1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:4px}
.stg div{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fg-3);min-width:0}
.stg i{height:6px;border-radius:3px;background:var(--surface-2)}
.stg .d i{background:var(--brand)}.stg .d{color:var(--fg-2)}
.stg .c i{background:linear-gradient(90deg,var(--brand) 50%,var(--surface-2) 50%)}.stg .c{color:var(--fg);font-weight:600}
.stg .x i{background:var(--err)}.stg .x{color:var(--err);font-weight:600}
.stg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due{font-size:12.5px;color:var(--fg-3)}.due b{color:var(--fg-2);font-weight:600}
.empty{border:1px dashed var(--line-2);border-radius:18px;padding:36px;text-align:center;color:var(--fg-3)}
/* detail */
.back{display:inline-flex;gap:6px;align-items:center;color:var(--fg-2);text-decoration:none;font-size:14px;margin-bottom:12px;background:none;border:0;padding:0}
.back .ico{width:16px;height:16px;rotate:180deg}
.dh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.dh h1{font:700 clamp(24px,2.6vw,32px)/1.15 var(--f-display);margin:6px 0 0;letter-spacing:-.02em}
.dh .meta{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--fg-3);font-size:13.5px;margin-top:6px}
.dh .acts{display:flex;gap:8px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.box{border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:14px}
.box h2{font:600 17px var(--f-display);margin:0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:32px 1fr;gap:12px;position:relative;padding-bottom:18px}
.tl li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.tl li.d:not(:last-child)::after{background:var(--brand)}
.tl .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);background:var(--surface);z-index:1}
.tl .n .ico{width:16px;height:16px}
.tl li.d .n{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tl li.c .n{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint)}
.tl b{font-weight:600}.tl .t{font-size:12.5px;color:var(--fg-3);margin-left:8px;font-family:var(--f-mono)}
.tl p{margin:2px 0 0;font-size:13.5px;color:var(--fg-2)}

.kit.new{border-style:dashed;align-items:center;justify-content:center;min-height:220px;color:var(--fg-2);gap:8px;background:none;cursor:pointer}
.ed{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.ed-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:88px}
.ed-nav button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:9px;color:var(--fg-2);font:500 14px var(--f-body);display:flex;justify-content:space-between;gap:8px}
.ed-nav button[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.ed-nav button small{font:500 11.5px var(--f-mono);color:var(--fg-3)}
.fam{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.fam+.fam{margin-top:12px}
.fam-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fam-h b{font:600 16px var(--f-display)}.fam-h small{display:block;color:var(--fg-3);font-size:12.5px}
.fam-s{padding:14px 16px;font-size:28px;line-height:1.25;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.fam-s.sm{font-size:15px;line-height:1.6;color:var(--fg-2)}
.faces{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.faces span{font-size:12.5px;padding:3px 9px;border-radius:8px;background:var(--surface-2);color:var(--fg-2)}
.cov{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px}
.cov span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:99px}
.cov .y{background:var(--ok-tint);color:var(--ok)}.cov .n{background:var(--err-tint);color:var(--err)}
.cov .ico{width:12px;height:12px;stroke-width:2.4}
.pairline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);font-size:13.5px;background:var(--surface-2)}
.pairline select{height:34px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);padding:0 8px}
.swrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.swrow:first-child{border-top:0}
.swrow .chip2{width:56px;height:56px;border-radius:12px;border:1px solid rgba(0,0,0,.08)}
.swrow b{font-weight:600}.swrow .vals{display:flex;gap:4px 14px;flex-wrap:wrap;font:500 12.5px var(--f-mono);color:var(--fg-2)}
.on-mat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.on-mat div{border-radius:14px;padding:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:96px}
.on-mat .kraft{background:#C9A673}.on-mat .white{background:#FBFAF7;border:1px solid var(--line)}
.on-mat i{width:38px;height:38px;border-radius:50%;display:block}
.on-mat small{flex-basis:100%;font-size:12px;color:#3B2E1E}
.on-mat .white small{color:#555}
.logos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lg{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.lg .p{height:110px;display:grid;place-items:center}
.lg .p.dk{background:#16201B}.lg .p.lt{background:var(--surface-2)}
.lg .m{padding:10px 12px;font-size:12.5px;color:var(--fg-3);border-top:1px solid var(--line)}
.lg .m b{display:block;font-size:13.5px;color:var(--fg)}
.lockrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.lockrow:first-child{border-top:0}
.lockrow b{font-weight:600}.lockrow small{display:block;color:var(--fg-3);font-size:12.5px}
.ver{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:13.5px;align-items:center}
.ver:first-child{border-top:0}.ver code{font:500 12px var(--f-mono)}
/* studio mock */
.stu{display:grid;grid-template-columns:64px 300px minmax(0,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);min-height:620px}
.stu-rail{background:var(--surface-2);display:flex;flex-direction:column;gap:4px;padding:10px 6px;border-right:1px solid var(--line)}
.stu-rail button{border:0;background:none;border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--fg-2)}
.stu-rail button[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.stu-rail .ico{width:20px;height:20px}
.stu-pan{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:720px}
.stu-pan h3{margin:0;font:600 13px var(--f-body);color:var(--fg-3)}
.stu-pan select{height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);padding:0 8px;width:100%}
.dots{display:flex;gap:8px;flex-wrap:wrap}.dots button{width:32px;height:32px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);padding:0}
.tstyle{border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;background:var(--surface);color:var(--fg);width:100%}
.tstyle small{display:block;color:var(--fg-3);font:500 11.5px var(--f-mono)}
.blk{display:flex;gap:8px;align-items:center;border:1px dashed var(--line-2);border-radius:10px;padding:8px 10px;font-size:13px;background:none;color:var(--fg);width:100%;text-align:left}
.blk .ico{width:16px;height:16px;color:var(--fg-3)}
.stu-can{background:var(--stage);position:relative;display:grid;place-items:center;padding:24px;min-width:0}
.stu-can svg{width:min(560px,100%);height:auto}
.stu-msg{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px}
.stu-msg .callout{box-shadow:var(--shadow)}
.chk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface);grid-column:1/-1;font-size:13px}
.chk b{font-weight:600}
.chk .pill{margin-right:2px}
@media (max-width:1100px){.logos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.stu{grid-template-columns:minmax(0,1fr)}.stu-rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.stu-pan{border-right:0;border-bottom:1px solid var(--line);max-height:none}}
@media (max-width:900px){.ed{grid-template-columns:minmax(0,1fr)}.ed-nav{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none}.ed-nav button{flex:none}}
@media (max-width:640px){.swrow{grid-template-columns:44px minmax(0,1fr)}.swrow .chip2{width:44px;height:44px}.swrow>:last-child{grid-column:1/-1}.on-mat{grid-template-columns:minmax(0,1fr)}.fam-s{font-size:22px}.ver{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1000px){.stu-can{display:flex;flex-direction:column;gap:12px}.stu-msg{position:static}}

.brandonly{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}.brandonly b{display:block;font-size:13px}.brandonly small{display:block;font-size:11.5px;color:var(--fg-3)}

(()=>{

$$('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.themeSet)));try{const v=localStorage.getItem('gp-theme');if(v)setTheme(v)}catch(e){}

/* sample kit (fake): brand font Latin-only + Thai companion, to show pairing and glyph coverage */
const KITS=[
 {id:'main',name:'แบรนด์หลัก',scope:'บริษัท',sw:['#1F3B2D','#C8553D','#F2E8D5','#2B2B2B'],font:'Playfair Display',th:'Mitr',logos:4,used:12,upd:'แก้ไข 2 วันก่อน'},
 {id:'kids',name:'ไลน์สินค้าเด็ก',scope:'บริษัท',sw:['#F4B942','#4AA3A2','#FFFFFF','#E85D75'],font:'Mitr',th:'Mitr',logos:2,used:3,upd:'แก้ไข 3 สัปดาห์ก่อน'},
 {id:'me',name:'ร้านของฉัน',scope:'ส่วนตัว',sw:['#3D405B','#E07A5F','#F4F1DE'],font:'Mitr',th:'Mitr',logos:1,used:1,upd:'แก้ไข 1 เดือนก่อน'}];

function shell(main){const nav=[['overview','ภาพรวม','i-home'],['orders','คำสั่งซื้อ','i-box'],['quotes','ใบเสนอราคา','i-receipt'],['designs','งานออกแบบ','i-pencil'],['reorder','สั่งซ้ำ','i-repeat'],['docs','เอกสาร','i-doc'],['msgs','ข้อความ','i-chat'],['rewards','คะแนนและสิทธิพิเศษ','i-gift'],['account','ข้อมูลบัญชี','i-user']];
 return `<div class="wrap shell"><nav class="anav" aria-label="เมนูบัญชี"><div class="me"><span class="av">กท</span><div><b>กมล ทดสอบ</b><small>ผู้ดูแล · บริษัท ทดสอบ รีเทล</small></div></div>${nav.map(([k,n,i],x)=>`${x===1?'<span class="sub">ซื้อ</span>':x===5?'<span class="sub">เอกสารและบัญชี</span>':''}<a href="#kits" ${k==='designs'?'aria-current="page"':''} ${k!=='designs'?`data-toast="ต้นแบบนี้เน้นคลังแบรนด์ · เมนู ${n} อยู่ในต้นแบบพอร์ทัล"`:''}>${ic(i)}${n}</a>`).join('')}</nav><main id="view" aria-live="polite">${main}</main></div>`}

/* ---- kits list ---- */
function kitsView(){return `<div class="ph"><div><h1>งานออกแบบ</h1><p>แบบกล่อง ตัวอย่างสินค้า แบบโครงสร้าง และคลังแบรนด์ที่ใช้ในสตูดิโอ</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-ghost" href="#import">${ic('i-upload')}นำเข้าจากคู่มือแบรนด์</a><a class="btn btn-primary" href="#kit">${ic('i-plus')}คลังแบรนด์ใหม่</a></div></div>`+tabs+
 `<div class="kits">${KITS.map(k=>`<a class="kit" href="#kit"><div class="sw">${k.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</div><div class="spec"><span class="a" style="font-family:'${k.font}','${k.th}',serif">Aa กข</span><span class="b">${k.font}${k.font!==k.th?` + ${k.th} (ไทย)`:''}</span></div><div class="kb"><b>${k.name} ${S}</b><small>${k.scope} · โลโก้ ${k.logos} แบบ · ใช้ใน ${k.used} แบบ · ${k.upd}</small></div></a>`).join('')}

function kitView(){const s=V.sec;const body={fonts:fontsSec,colors:colorsSec,logos:logosSec,styles:stylesSec,blocks:blocksSec,rules:rulesSec,people:peopleSec,history:historySec}[s]();

 <div class="ed"><nav class="ed-nav" aria-label="ส่วนของคลังแบรนด์">${SECS.map(([k,n,c])=>`<button type="button" data-sec="${k}" aria-current="${k===s}">${n}<small>${c}</small></button>`).join('')}</nav><div>${body}</div></div>`}
function fontsSec(){return `<div class="sec2" style="margin-top:0"><h2>ฟอนต์ <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" type="button" data-lib>${ic('i-search')}คลังฟอนต์ฟรี</button><button class="btn btn-primary btn-sm" type="button" data-up>${ic('i-upload')}อัปโหลดฟอนต์</button></span></h2>
 <div class="fam"><div class="fam-h"><div><b>Playfair Display</b><small>ฟอนต์หัวข้อ · อัปโหลดโดย กมล · 12 ต.ค. 2569 ${S}</small></div><span class="badge2 g">ใช้ได้เฉพาะบริษัทนี้</span></div>
  <div class="fam-s" style="font-family:'Playfair Display','Mitr',serif">Fresh Roast Coffee · กาแฟคั่วสด ฿189</div>
  <div class="faces">${['Regular 400','Italic 400','SemiBold 600','Bold 700','Black 900'].map(x=>`<span>${x}</span>`).join('')}</div>

 <div class="fam"><div class="fam-h"><div><b>Mitr</b><small>ฟอนต์เนื้อหา · จากคลังฟอนต์ฟรี (OFL)</small></div><span class="badge2">ฟรี ใช้เชิงพาณิชย์ได้</span></div>
  <div class="fam-s sm" style="font-family:'Mitr',sans-serif">ส่วนประกอบ: เมล็ดกาแฟอาราบิก้า 100% จากดอยช้าง คั่วระดับกลาง น้ำหนักสุทธิ 250 กรัม</div>
  <div class="cov"><span class="y">${ic('i-check')}ภาษาไทย</span><span class="y">${ic('i-check')}Latin</span><span class="y">${ic('i-check')}฿</span><span class="y">${ic('i-check')}ตัวเลขไทย</span></div></div>
 <div class="callout i" style="margin-top:12px">${ic('i-shield')}<div><b>ฟอนต์ของคุณไม่ถูกส่งออกไปไหน</b><p>ใช้ได้เฉพาะคนในบริษัทนี้ ไฟล์พิมพ์ที่ส่งเข้าผลิตเป็นภาพของงานที่เรนเดอร์แล้ว ไม่มีไฟล์ฟอนต์แนบไป</p></div></div></div>`}
function colorsSec(){const C=[['เขียวป่า','#1F3B2D','C 80 M 40 Y 85 K 50','Pantone 3435 C',1],['ส้มดินเผา','#C8553D','C 10 M 80 Y 80 K 5','Pantone 7417 C',0],['ครีม','#F2E8D5','C 3 M 7 Y 17 K 0','—',0],['ถ่าน','#2B2B2B','C 0 M 0 Y 0 K 90','—',0]];
 return `<div class="sec2" style="margin-top:0"><h2>สี <button class="btn btn-primary btn-sm" type="button" data-toast="ต้นแบบ: เพิ่มสี (hex / CMYK / Pantone หรือดูดสีจากโลโก้)">${ic('i-plus')}เพิ่มสี</button></h2>
 <div class="set" style="padding:0">${C.map(([n,h,c,p,spot])=>`<div class="swrow"><span class="chip2" style="background:${h}"></span><div><b>${n} ${S}</b><div class="vals"><span>${h}</span><span>${c}</span><span>${p}</span></div></div><div style="display:flex;gap:8px;align-items:center">${spot?'<span class="badge2">สีพิเศษ</span>':''}<button class="btn btn-ghost btn-sm" type="button" data-toast="ต้นแบบ: แก้ค่าสี">แก้ไข</button></div></div>`).join('')}</div>
 <div class="sec2"><h2>ดูบนวัสดุจริง</h2><p class="lede2">สีเดียวกันบนกระดาษคราฟท์จะเข้มและอมน้ำตาลกว่าบนกระดาษขาว ตัวอย่างนี้จำลองให้เห็นคร่าว ๆ ก่อนขอตัวอย่างพิมพ์จริง</p>
 <div class="on-mat"><div class="kraft">${C.map(x=>`<i style="background:${x[1]};mix-blend-mode:multiply"></i>`).join('')}<small>บนคราฟท์ KA125</small></div><div class="white">${C.map(x=>`<i style="background:${x[1]}"></i>`).join('')}<small>บนกระดาษขาว</small></div></div></div></div>`}
function logoSVG(fg,bg){return `<svg viewBox="0 0 120 40" width="120" aria-hidden="true"><circle cx="18" cy="20" r="12" fill="${fg}"/><path d="M12 22c4-8 8-8 12 0" stroke="${bg}" stroke-width="2.5" fill="none"/><text x="38" y="26" font-family="Playfair Display,serif" font-size="16" font-weight="700" fill="${fg}">Roastery</text></svg>`}
